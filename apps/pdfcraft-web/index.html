<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PdfCraft</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      #pdfcraft-graphics-recovery { position: fixed; inset: 0; z-index: 10; padding: 8vh max(24px, calc((100vw - 720px) / 2)); overflow: auto; background: #f1f1f3; color: #202026; font: 17px/1.5 system-ui, sans-serif; }
      #pdfcraft-graphics-recovery[hidden] { display: none; }
      #pdfcraft-graphics-recovery button { display: block; padding: 12px 20px; margin: 12px 0; font: inherit; cursor: pointer; }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>
  </head>
  <body>
    <canvas id="pdfcraft"></canvas>
  </body>
</html>
