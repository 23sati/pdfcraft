[package]
name = "pdfcraft-platform"
description = "Operating-system services shared by the PdfCraft desktop app and automation tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "0.8"
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's light/dark choice (see `desktop_theme.rs`). Already in the tree, with the features
# this needs, through accesskit's accessibility bus; pinned to the same version so nothing is
# built twice.
zbus = "=5.19.0"
