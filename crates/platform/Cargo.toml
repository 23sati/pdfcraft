[package]
name = "pdfcraft-platform"
description = "Operating-system services shared by the PdfCraft desktop app and automation tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Reuse DeckCraft's native PowerPoint reader and PDF exporter for PPTX → PDF.
deckcraft-pptx = { version = "0.5", git = "https://github.com/earlvanze/deckcraft", rev = "82f7b2def92175d936f35acc79856d1553608029" }
deckcraft-pdf = { version = "0.5", git = "https://github.com/earlvanze/deckcraft", rev = "82f7b2def92175d936f35acc79856d1553608029" }
deckcraft-fonts = { version = "0.5", git = "https://github.com/earlvanze/deckcraft", rev = "82f7b2def92175d936f35acc79856d1553608029", features = ["bundled-fonts-only"] }
gridcraft-engine = { version = "0.5", git = "https://github.com/storytold/gridcraft", rev = "347d2a5bc2e8d8f89c093e20fbbed4b67d5ac28f" }
wordcraft-engine = { version = "0.5", git = "https://github.com/earlvanze/wordcraft", rev = "dfe93890602c17baab3c59380b78f8c945e6980c" }
wordcraft-pdf = { version = "0.5", git = "https://github.com/earlvanze/wordcraft", rev = "dfe93890602c17baab3c59380b78f8c945e6980c" }
wordcraft-fonts = { version = "0.5", git = "https://github.com/earlvanze/wordcraft", rev = "dfe93890602c17baab3c59380b78f8c945e6980c", features = ["bundled-fonts-only"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the dependency graph through the accessibility integration. The portal watcher
# uses the async API so dropping it can cancel an idle subscription without polling.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"

[dev-dependencies]
# Exercise the actual portal wire decoder and cancellable worker on every native test host.
deckcraft-model = { version = "0.5", git = "https://github.com/earlvanze/deckcraft", rev = "82f7b2def92175d936f35acc79856d1553608029" }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"
