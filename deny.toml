# cargo-deny policy (M0.4). Run with `cargo xtask deny`; part of `cargo xtask ci`.
# Code dependencies follow the same rule as assets (AGENTS.md): permissive licences only.
# Copyleft (GPL, AGPL, LGPL) is never linked; such tools run only as external oracle processes.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Shared UI components and native Office engines. Cargo.toml pins immutable revisions.
allow-git = [
    "https://github.com/storytold/craft-libs",
    "https://github.com/earlvanze/deckcraft",
    "https://github.com/storytold/gridcraft",
    "https://github.com/earlvanze/wordcraft",
]

[advisories]
yanked = "warn"
ignore = [
    # Marvin (RSA private-key timing side channel, no fixed `rsa` release). pdfcraft-sign uses
    # `rsa` only for public-key signature verification, which the advisory does not affect; RSA
    # private-key operations use aws-lc-rs on native targets and are refused in the browser
    # (ADR-0009). Revisit when a fixed `rsa` ships.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for verification only (ADR-0009)" },
    # krilla 0.8.2's simple-text API still depends on rustybuzz. DeckCraft uses it for slide
    # notes and page labels; no maintained krilla release removes that dependency yet.
    { id = "RUSTSEC-2026-0206", reason = "krilla 0.8.2 requires rustybuzz for simple-text; replace when krilla migrates" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled only through krilla's rustybuzz dependency" },
]

# egui's default UI fonts (Ubuntu-Light, Hack, emoji-icon-font): font licences on the AGENTS.md
# §1.2 allowlist, attributed in ATTRIBUTION.toml as dependency-bundled assets.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
