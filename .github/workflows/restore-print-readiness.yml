name: restore-print-readiness

on:
  push:
    branches:
      - cursor/print-readiness-verify-3ab3
    paths:
      - ".print-restore/print.patch"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore sources and apply the verification patch
        run: |
          set -euo pipefail
          if [ ! -f .print-restore/print.patch ]; then
            echo "already restored"
            exit 0
          fi
          git checkout 2796f3de0d3553a3e15c4a9e4b365ddac7a55a72 -- crates/automation/src/lib.rs crates/engine/src/ocr.rs
          git apply .print-restore/print.patch
          git add crates/automation/src/lib.rs crates/engine/src/ocr.rs
          python3 - << 'PY'
          import hashlib
          import pathlib

          def blob(path):
              data = pathlib.Path(path).read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest(), len(data)

          expected = {
              "crates/automation/src/lib.rs": "686a6f75734b866c041482d89503c72f664912fa",
              "crates/engine/src/ocr.rs": "43558b7453c14e03efca378615dc0db6be2e93a1",
          }
          for path, sha in expected.items():
              got, size = blob(path)
              print(f"{path} {got} {size}")
              if got != sha:
                  raise SystemExit(f"unexpected {path}")
          PY
          if git ls-files --error-unmatch crates/automation/src/session_tests.rs >/dev/null 2>&1; then
            git rm -f crates/automation/src/session_tests.rs
          fi
          git rm -r .print-restore
          git rm -f .github/workflows/restore-print-readiness.yml
          git config user.name "Baltsar"
          git config user.email "gustaf.garnow@gmail.com"
          git commit -m "Restore the print-readiness dispatch from the original sources."
          git push origin HEAD
